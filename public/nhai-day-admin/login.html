<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NHAI DAY Admin</title>
<style>
:root{--bg:#0A0E1A;--bg2:#121828;--bg3:#1a2133;--border:#252d42;--text:#e8ecf5;--textM:#8b95ab;--gold:#d4a24a;--danger:#e05260}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:20px}
.box{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:360px;text-align:center}
h1{font-size:18px;font-weight:700;margin:0 0 4px}
p{font-size:12px;color:var(--textM);margin:0 0 20px;line-height:1.6}
input{width:100%;padding:11px 14px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);
  color:var(--text);font-size:14px;outline:none;margin-bottom:10px;font-family:inherit}
input:focus{border-color:var(--gold)}
button{width:100%;padding:11px;border-radius:8px;border:none;background:var(--gold);color:#0A0E1A;
  font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
button:disabled{opacity:.6;cursor:default}
.msg{font-size:12px;margin-top:12px;min-height:16px}
.err{color:var(--danger)}
.ok{color:var(--gold)}
</style>
</head>
<body>
<div class="box">
  <h1>NHAI DAY Admin</h1>
  <p id="sub">Đang kiểm tra…</p>
  <form id="f" style="display:none">
    <input type="password" id="pwd" placeholder="Mật khẩu" autocomplete="current-password" autofocus>
    <input type="password" id="pwd2" placeholder="Nhập lại mật khẩu" autocomplete="new-password" style="display:none">
    <button type="submit" id="btn">Đăng nhập</button>
  </form>
  <div class="msg" id="msg"></div>
</div>
<script>
var setup=false;
var sub=document.getElementById('sub'),f=document.getElementById('f'),msg=document.getElementById('msg'),
    pwd=document.getElementById('pwd'),pwd2=document.getElementById('pwd2'),btn=document.getElementById('btn');

fetch('/api/admin-session').then(function(r){return r.json()}).then(function(d){
  if(d.authed){location.reload();return;}
  setup=!d.passwordSet;
  if(setup){
    sub.textContent='Chưa có mật khẩu. Đặt mật khẩu quản trị lần đầu (tối thiểu 8 ký tự).';
    pwd.placeholder='Mật khẩu mới';
    pwd.setAttribute('autocomplete','new-password');
    pwd2.style.display='';
    btn.textContent='Đặt mật khẩu';
  }else{
    sub.textContent='Nhập mật khẩu để tiếp tục';
  }
  f.style.display='';
  pwd.focus();
}).catch(function(){sub.textContent='Không kết nối được máy chủ.';});

f.addEventListener('submit',function(e){
  e.preventDefault();
  msg.className='msg';msg.textContent='';
  var v=pwd.value;
  if(!v){msg.className='msg err';msg.textContent='Chưa nhập mật khẩu.';return;}
  if(setup){
    if(v.length<8){msg.className='msg err';msg.textContent='Mật khẩu phải từ 8 ký tự.';return;}
    if(v!==pwd2.value){msg.className='msg err';msg.textContent='Hai mật khẩu không khớp.';return;}
  }
  btn.disabled=true;btn.textContent='Đang xử lý…';
  fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:v})})
    .then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})})
    .then(function(x){
      if(x.d.ok){msg.className='msg ok';msg.textContent='Thành công, đang vào…';location.reload();return;}
      msg.className='msg err';msg.textContent=x.d.message||'Không đăng nhập được.';
      btn.disabled=false;btn.textContent=setup?'Đặt mật khẩu':'Đăng nhập';
      pwd.value='';pwd2.value='';pwd.focus();
    })
    .catch(function(){
      msg.className='msg err';msg.textContent='Lỗi kết nối.';
      btn.disabled=false;btn.textContent=setup?'Đặt mật khẩu':'Đăng nhập';
    });
});
</script>
</body>
</html>
